services:
  db:
    image: postgres:15-alpine
    container_name: yolo_analytics_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yolo_deepstream_backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    network_mode: host
    env_file:
      - ./web-dashboard/.env.local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./backend:/app
      # Keep runtime artifacts on the host.  These mounts remain intact when
      # the container is recreated and prevent TensorRT from rebuilding models.
      - ./backend/models:/app/models
      - ./backend/models_config/weights:/app/models_config/weights
      - ./backend/data:/app/data
      - ${RECORDINGS_HOST_DIR:-./recordings}:/var/vms/recordings
      - ./backend/models_config/DeepStream-Yolo/nvdsinfer_custom_impl_Yolo/libnvdsinfer_custom_impl_Yolo.so:/opt/visionmanager/libnvdsinfer_custom_impl_Yolo.so:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=$DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISABLE_DEEPSTREAM_GST=0
      - DISABLE_CUSTOM_DETECTOR=0
      # The bundled yolo11l-pose sample is not an active detector. Inference
      # begins only when an uploaded model is Ready and deployed from the UI.
      - ENABLE_LEGACY_DEEPSTREAM_PIPELINE=0
      - ENABLE_DEEPSTREAM_DISPLAY=0
      - ENABLE_CPU_TRACKER_FALLBACK=0
      - CPU_TRACKER_PERSON_ONLY=1
      - FMS_IP=192.168.5.105
      - FMS_MQTT_PORT=1883
      - FMS_ORIGIN_X=185.0
      - FMS_ORIGIN_Y=194.5
      - FMS_LAYOUT_DEPTH=18.0
      # Project-local NvDCF config: GPU correlation tracker without the
      # optional sample ReID engine that is not shipped in the container.
      - DEEPSTREAM_TRACKER_CONFIG=/app/models_config/tracker_config.yml
      - REID_ONNX_FILE=/app/models/reid_512.onnx
      - RECORDINGS_DIR=/var/vms/recordings
      - SYSTEM_LOG_DIR=/app/data/system_logs
      - SYSTEM_LOG_RETENTION_DAYS=7
      - SYSTEM_LOG_ARCHIVE_DAYS=30
      - SYSTEM_LOG_ARCHIVE_MB=512
      - ENABLE_EVIDENCE_RECORDING=1
      - RECORDING_SEGMENT_SECONDS=3600
      - RECORDING_RETENTION_HOURS=48
      - RECORDING_MIN_FREE_GB=2
      - IDENTITY_TEMPLATE_ENABLE_MOTION=1
      - IDENTITY_TEMPLATE_TARGET_FPS=25
      - REGISTERED_MASK_TARGET_FPS=15
      - REGISTERED_MASK_FLOW_MAX_AGE=1.8
      - REGISTERED_MASK_HOLD_SEC=0.25
      # Monitor receives this low-bitrate relay; DeepStream input stays 1280x720.
      - DISPLAY_PREVIEW_ENABLED=1
      - DISPLAY_PREVIEW_WIDTH=640
      - DISPLAY_PREVIEW_HEIGHT=360
      - DISPLAY_PREVIEW_FPS=25
      - DISPLAY_PREVIEW_BITRATE_KBPS=1200
      - DISPLAY_PREVIEW_ENCODER=libx264
      - DISPLAY_PREVIEW_PRESET=veryfast
      # Filter camera-projection noise for stationary racks in the 3D Twin.
      - RACK_POSITION_DEADBAND_M=0.12
      - RACK_MOVE_CONFIRM_M=0.40
      - RACK_MOVE_CONFIRM_FRAMES=3
      - RACK_MOVE_CONFIRM_WINDOW_SEC=1.2
      - RACK_MOVE_SMOOTH_ALPHA=0.30

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: yolo_mediamtx
    restart: always
    network_mode: host
    volumes:
      - ./services/mediamtx/mediamtx.yml:/mediamtx.yml

  frontend:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    image: rskyview-frontend:local
    container_name: yolo_frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    network_mode: host
    env_file:
      - ./web-dashboard/.env.local

volumes:
  postgres_data:
